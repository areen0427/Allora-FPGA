name: Release Apple Silicon app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Apple Silicon DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: allora-fpga/package-lock.json

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = require('./allora-fpga/package.json').version;
          const tauriVersion = require('./allora-fpga/src-tauri/tauri.conf.json').version;
          const cargoVersion = fs.readFileSync('./allora-fpga/src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (process.env.RELEASE_TAG !== `v${version}` || tauriVersion !== version || cargoVersion !== version) {
            throw new Error(`Release versions differ: tag=${process.env.RELEASE_TAG}, npm=${version}, Tauri=${tauriVersion}, Cargo=${cargoVersion}`);
          }
          NODE

      - name: Install Rust for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci
        working-directory: allora-fpga

      - name: Build DMG and create draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}
        with:
          projectPath: allora-fpga
          tagName: ${{ github.ref_name }}
          releaseName: "Allora FPGA ${{ github.ref_name }}"
          releaseBody: "Apple Silicon macOS installer. Download the DMG from the assets below."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles dmg
