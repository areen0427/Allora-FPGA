name: Release Apple Silicon app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Apple Silicon DMG
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Require a macOS release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow on an existing vX.Y.Z release tag."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: allora-fpga/package-lock.json

      - name: Test release version synchronization
        run: node --test tests/release-version.test.mjs
        working-directory: allora-fpga

      - name: Set app version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node allora-fpga/scripts/set-release-version.mjs

      - name: Install Rust for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci
        working-directory: allora-fpga

      - name: Build DMG and create draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}
        with:
          projectPath: allora-fpga
          tagName: ${{ github.ref_name }}
          releaseName: "Allora FPGA ${{ github.ref_name }}"
          releaseBody: "Apple Silicon macOS installer. Download the DMG from the assets below."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target aarch64-apple-darwin --bundles dmg -- --locked
