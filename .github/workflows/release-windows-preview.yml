name: Windows preview installer

on:
  push:
    branches:
      - codex/windows-preview
    tags:
      - "windows-v*"
  workflow_dispatch:

permissions:
  contents: write

# Keep retries for a tag from updating the same draft at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Require a Windows preview tag for tag builds
        if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/windows-v') }}
        run: throw 'Select a windows-v* tag for a Windows release, or a branch for an artifact-only build.'

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: allora-fpga/package-lock.json

      - name: Verify release version handling
        run: node --test tests/release-version.test.mjs
        working-directory: allora-fpga

      - name: Set app version from release tag
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node allora-fpga/scripts/set-release-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: allora-fpga

      - name: Build branch installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked
        working-directory: allora-fpga
        env:
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}

      - name: Upload branch installer for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: allora-fpga-windows-x64-preview
          path: allora-fpga/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build installer and create draft prerelease
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}
        with:
          projectPath: allora-fpga
          tagName: ${{ github.ref_name }}
          releaseName: "Allora FPGA Windows preview ${{ github.ref_name }}"
          releaseBody: "Experimental Windows x64 build. The app launches, but project creation and other native workflows are not yet verified. Download the NSIS installer, then run the companion Windows requirements script for FPGA tools. Do not use this preview for irreplaceable projects."
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Package optional FPGA toolchain setup
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        shell: pwsh
        run: |
          $source = 'allora-fpga/src-tauri/resources/windows'
          Compress-Archive -Path "$source/install-windows-requirements.ps1", "$source/windows-runtime-requirements.txt", "$source/windows-build-requirements.txt" -DestinationPath 'allora-fpga-windows-requirements.zip'

      - name: Attach setup script to draft prerelease
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload $env:RELEASE_TAG 'allora-fpga-windows-requirements.zip' --repo $env:GITHUB_REPOSITORY --clobber
