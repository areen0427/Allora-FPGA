name: Windows preview installer

on:
  push:
    branches:
      - codex/windows-preview
    tags:
      - "windows-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-preview:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: allora-fpga/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: allora-fpga

      - name: Build branch installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- --bundles nsis
        working-directory: allora-fpga
        env:
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}

      - name: Upload branch installer for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: allora-fpga-windows-x64-preview
          path: allora-fpga/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build installer and create draft prerelease
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLORA_GITHUB_CLIENT_ID: ${{ vars.ALLORA_GITHUB_CLIENT_ID }}
        with:
          projectPath: allora-fpga
          tagName: ${{ github.ref_name }}
          releaseName: "Allora FPGA Windows preview ${{ github.ref_name }}"
          releaseBody: "Experimental Windows x64 build. The app launches, but project creation and other native workflows are not yet verified. Download the NSIS installer, then run the companion Windows requirements script for FPGA tools. Do not use this preview for irreplaceable projects."
          releaseDraft: true
          prerelease: true
          args: --bundles nsis

      - name: Package optional FPGA toolchain setup
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        shell: pwsh
        run: |
          $source = 'allora-fpga/src-tauri/resources/windows'
          Compress-Archive -Path "$source/install-windows-requirements.ps1", "$source/windows-runtime-requirements.txt", "$source/windows-build-requirements.txt" -DestinationPath 'allora-fpga-windows-requirements.zip'

      - name: Attach setup script to draft prerelease
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload $env:RELEASE_TAG 'allora-fpga-windows-requirements.zip' --clobber
