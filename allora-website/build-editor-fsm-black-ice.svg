<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="traffic_fsm.sv RTL code example"><rect width="1000" height="760" rx="24" fill="#101e34"/><rect x="1" y="1" width="998" height="758" rx="23" fill="none" stroke="#35547a" stroke-width="2"/><path d="M1 70H999" stroke="#35547a" stroke-width="2"/><rect x="1" y="1" width="998" height="68" rx="23" fill="#172b49"/><path d="M1 48H999V70H1" fill="#172b49"/><text x="34" y="46" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="700">traffic_fsm.sv</text><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" xml:space="preserve"><text x="85" y="116" fill="#e6f0ff">typedef enum logic [1:0] {</text><text x="34" y="116" fill="#9fb4d3">1</text><text x="85" y="153" fill="#e6f0ff">  RED, GREEN, YELLOW</text><text x="34" y="153" fill="#9fb4d3">2</text><text x="85" y="190" fill="#e6f0ff">} state_t;</text><text x="34" y="190" fill="#9fb4d3">3</text><text x="85" y="227" fill="#e6f0ff">state_t state, next;</text><text x="34" y="227" fill="#9fb4d3">4</text><text x="85" y="264" fill="#e6f0ff"></text><text x="34" y="264" fill="#9fb4d3">5</text><text x="85" y="301" fill="#e6f0ff">always_ff @(posedge clk or negedge rst_n)</text><text x="34" y="301" fill="#9fb4d3">6</text><text x="85" y="338" fill="#e6f0ff">  if (!rst_n) state &lt;= RED;</text><text x="34" y="338" fill="#9fb4d3">7</text><text x="85" y="375" fill="#e6f0ff">  else        state &lt;= next;</text><text x="34" y="375" fill="#9fb4d3">8</text><text x="85" y="412" fill="#e6f0ff"></text><text x="34" y="412" fill="#9fb4d3">9</text><text x="85" y="449" fill="#e6f0ff">always_comb begin</text><text x="34" y="449" fill="#9fb4d3">10</text><text x="85" y="486" fill="#e6f0ff">  case (state)</text><text x="34" y="486" fill="#9fb4d3">11</text><text x="85" y="523" fill="#e6f0ff">    RED:    next = GREEN;</text><text x="34" y="523" fill="#9fb4d3">12</text><text x="85" y="560" fill="#e6f0ff">    GREEN:  next = YELLOW;</text><text x="34" y="560" fill="#9fb4d3">13</text><text x="85" y="597" fill="#e6f0ff">    default: next = RED;</text><text x="34" y="597" fill="#9fb4d3">14</text><text x="85" y="634" fill="#e6f0ff">  endcase</text><text x="34" y="634" fill="#9fb4d3">15</text><text x="85" y="671" fill="#e6f0ff">end</text><text x="34" y="671" fill="#9fb4d3">16</text></g></svg>