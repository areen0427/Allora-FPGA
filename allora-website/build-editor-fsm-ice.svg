<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="traffic_fsm.sv RTL code example"><rect width="1000" height="760" rx="24" fill="#f2f7ff"/><rect x="1" y="1" width="998" height="758" rx="23" fill="none" stroke="#bad3f8" stroke-width="2"/><path d="M1 70H999" stroke="#bad3f8" stroke-width="2"/><rect x="1" y="1" width="998" height="68" rx="23" fill="#e8f2ff"/><path d="M1 48H999V70H1" fill="#e8f2ff"/><text x="34" y="46" fill="#2563eb" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="700">traffic_fsm.sv</text><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" xml:space="preserve"><text x="85" y="116" fill="#14233b">typedef enum logic [1:0] {</text><text x="34" y="116" fill="#6d7f9a">1</text><text x="85" y="153" fill="#14233b">  RED, GREEN, YELLOW</text><text x="34" y="153" fill="#6d7f9a">2</text><text x="85" y="190" fill="#14233b">} state_t;</text><text x="34" y="190" fill="#6d7f9a">3</text><text x="85" y="227" fill="#14233b">state_t state, next;</text><text x="34" y="227" fill="#6d7f9a">4</text><text x="85" y="264" fill="#14233b"></text><text x="34" y="264" fill="#6d7f9a">5</text><text x="85" y="301" fill="#14233b">always_ff @(posedge clk or negedge rst_n)</text><text x="34" y="301" fill="#6d7f9a">6</text><text x="85" y="338" fill="#14233b">  if (!rst_n) state &lt;= RED;</text><text x="34" y="338" fill="#6d7f9a">7</text><text x="85" y="375" fill="#14233b">  else        state &lt;= next;</text><text x="34" y="375" fill="#6d7f9a">8</text><text x="85" y="412" fill="#14233b"></text><text x="34" y="412" fill="#6d7f9a">9</text><text x="85" y="449" fill="#14233b">always_comb begin</text><text x="34" y="449" fill="#6d7f9a">10</text><text x="85" y="486" fill="#14233b">  case (state)</text><text x="34" y="486" fill="#6d7f9a">11</text><text x="85" y="523" fill="#14233b">    RED:    next = GREEN;</text><text x="34" y="523" fill="#6d7f9a">12</text><text x="85" y="560" fill="#14233b">    GREEN:  next = YELLOW;</text><text x="34" y="560" fill="#6d7f9a">13</text><text x="85" y="597" fill="#14233b">    default: next = RED;</text><text x="34" y="597" fill="#6d7f9a">14</text><text x="85" y="634" fill="#14233b">  endcase</text><text x="34" y="634" fill="#6d7f9a">15</text><text x="85" y="671" fill="#14233b">end</text><text x="34" y="671" fill="#6d7f9a">16</text></g></svg>